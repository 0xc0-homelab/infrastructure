# Runs every playbook from the pipeline (operator decision, 2026-09-29): with
# --check --diff on every PR that touches Ansible, for real on a merge to main,
# once the operator approves the production environment. The steps live in the
# reusable workflow in 0xc0-homelab/.github; this repo keeps the triggers and
# the order.
name: ansible

on:
  pull_request:
    branches: [main]
    paths: ['ansible/**', 'scripts/ansible', 'scripts/vault-env', '.github/workflows/ansible.yml']
  push:
    branches: [main]
    paths: ['ansible/**', 'scripts/ansible', 'scripts/vault-env', '.github/workflows/ansible.yml']

# id-token: the job logs in to Vault with GitHub's OIDC token.
permissions:
  contents: read
  id-token: write

jobs:
  ansible:
    uses: 0xc0-homelab/.github/.github/workflows/ansible.yml@main
    with:
      # The wrapper reads the tunnel token and the admin keys from this root.
      tofu-root: environments/prod
      # The cluster first; the CI VMs last, one at a time, since their runners
      # run this job, and a busy one is left for its next start.
      playbooks: |
        playbooks/cluster.yml
        playbooks/vm-access.yml
        playbooks/vm-ci.yml
      # Every secret from Vault (ci/infrastructure/*, ci/shared/*), with GitHub's
      # OIDC token.
      vault-addr: https://vault.int.0xc0.cc
      vault-role: infrastructure
      vault-secrets: |
        ci/data/shared/rustfs access_key_id | AWS_ACCESS_KEY_ID ;
        ci/data/shared/rustfs secret_access_key | AWS_SECRET_ACCESS_KEY ;
        ci/data/infrastructure/ssh private_key | CI_SSH_PRIVATE_KEY ;
        ci/data/infrastructure/runner-app private_key | GITHUB_RUNNER_APP_PRIVATE_KEY ;
        ci/data/infrastructure/rke2 token | RKE2_TOKEN ;
        ci/data/infrastructure/argocd admin_password_bcrypt | ARGOCD_ADMIN_PASSWORD_BCRYPT ;
      # The key CI logs in to the VMs with, one of vault-secrets.
      ssh-key-env: CI_SSH_PRIVATE_KEY
