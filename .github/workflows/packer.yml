# Validates the Packer templates on every PR that touches them or the roles
# they bake, and rebuilds them all on a merge to main, once the operator
# approves the production environment. The steps live in the reusable workflow
# in 0xc0-homelab/.github; this repo keeps the triggers and provides
# scripts/delete-template and scripts/packer.
name: packer

on:
  pull_request:
    branches: [main]
    paths: ['packer/**', 'ansible/roles/base/**', 'ansible/roles/github_runner/**', 'scripts/packer', 'scripts/delete-template', '.github/workflows/packer.yml']
  push:
    branches: [main]
    paths: ['packer/**', 'ansible/roles/base/**', 'ansible/roles/github_runner/**', 'scripts/packer', 'scripts/delete-template', '.github/workflows/packer.yml']

# id-token: the reusable workflow asks for it (Vault logins).
permissions:
  contents: read
  id-token: write

jobs:
  packer:
    uses: 0xc0-homelab/.github/.github/workflows/packer.yml@main
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
