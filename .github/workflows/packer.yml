# Validates the Packer templates on every PR that touches them or the roles
# they bake, and rebuilds them all on a merge to main, once the operator
# approves the production environment. The steps live in the reusable workflow
# in 0xc0-labs/.github; this repo keeps the triggers and provides
# scripts/delete-template and scripts/packer.
name: packer

on:
  pull_request:
    branches: [main]
    paths: ['packer/**', 'ansible/roles/base/**', 'ansible/roles/github_runner/**', 'scripts/packer', 'scripts/delete-template', 'scripts/vault-env', '.github/workflows/packer.yml']
  push:
    branches: [main]
    paths: ['packer/**', 'ansible/roles/base/**', 'ansible/roles/github_runner/**', 'scripts/packer', 'scripts/delete-template', 'scripts/vault-env', '.github/workflows/packer.yml']

# id-token: the build logs in to Vault with GitHub's OIDC token.
permissions:
  contents: read
  id-token: write

jobs:
  packer:
    uses: 0xc0-labs/.github/.github/workflows/packer.yml@main
    with:
      # Every secret from Vault (ci/infrastructure/*, ci/shared/*), with GitHub's
      # OIDC token.
      vault-addr: https://vault.int.0xc0.cc
      vault-role: infrastructure
      vault-secrets: |
        ci/data/infrastructure/proxmox endpoint | PROXMOX_VE_ENDPOINT ;
        ci/data/infrastructure/proxmox api_token | PROXMOX_VE_API_TOKEN ;
