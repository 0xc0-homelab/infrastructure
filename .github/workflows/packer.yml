# Validates the Packer templates on every PR that touches them or the roles
# they bake, and rebuilds them all on a merge to main, once the operator
# approves the production environment. A rebuild deletes each template by name
# and builds it again, in packer/build-order. VMs are full clones: none changes
# until it is rebuilt with its `rebuild` counter.
name: packer

on:
  pull_request:
    branches: [main]
    paths: ['packer/**', 'ansible/roles/base/**', 'ansible/roles/github_runner/**', 'scripts/packer', 'scripts/delete-template', '.github/workflows/packer.yml']
  push:
    branches: [main]
    paths: ['packer/**', 'ansible/roles/base/**', 'ansible/roles/github_runner/**', 'scripts/packer', 'scripts/delete-template', '.github/workflows/packer.yml']

permissions:
  contents: read

jobs:
  # No secrets and no network beyond the plugin downloads: GitHub's runners,
  # fork PRs included.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: packer

      - name: validate
        env:
          # validate checks the variables' presence, not their values.
          PKR_VAR_proxmox_url: https://example.invalid/api2/json
          PKR_VAR_proxmox_username: validate@pve!validate
          PKR_VAR_proxmox_token: validate
        run: |
          packer fmt -check -recursive packer
          for t in packer/*/; do
            packer init "$t"
            packer validate "$t"
          done

  # Inside the network: the build VM is reached over SSH in the ci zone. The
  # runner group admits this workflow only as it is on main.
  build:
    if: github.event_name == 'push'
    runs-on:
      group: homelab
      labels: homelab
    environment: production
    timeout-minutes: 60
    # One build at a time; a running one is never cancelled, or it leaves a
    # half-built VM behind.
    concurrency:
      group: packer-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: packer sops jq uv ansible

      # Same as the tofu workflows: the CI key in the job's temporary
      # directory, and every decrypted value masked.
      - name: secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          key_file="$RUNNER_TEMP/age-key.txt"
          ( umask 077 && printf '%s\n' "$SOPS_AGE_KEY" > "$key_file" )
          echo "SOPS_AGE_KEY_FILE=$key_file" >> "$GITHUB_ENV"
          export SOPS_AGE_KEY_FILE="$key_file"
          sops decrypt --output-type json secrets/tofu.sops.yaml | jq -r '.[] | strings' |
            while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done
          token="$(sops decrypt --extract '["PROXMOX_VE_API_TOKEN"]' secrets/tofu.sops.yaml)"
          echo "::add-mask::${token#*=}"

      # Each template clones the one before it in build-order. Proxmox never
      # overwrites a template: the old one is deleted by name first.
      - name: build
        run: |
          # A for loop, not while-read: a command in the loop reading stdin
          # would eat the rest of the list.
          for name in $(grep -vE '^(#|$)' packer/build-order); do
            echo "::group::$name"
            scripts/delete-template "$name"
            scripts/packer "$name" init
            scripts/packer "$name" build -color=false -var "commit=${GITHUB_SHA::12}"
            echo "::endgroup::"
          done
