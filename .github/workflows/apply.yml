# Applies environments/prod after a merge to main, once the operator approves
# the production environment.
name: apply

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    uses: 0xc0-homelab/.github/.github/workflows/tofu-apply.yml@main
    with:
      working-directory: environments/prod
      environment: production
    secrets:
      PROXMOX_VE_ENDPOINT: ${{ secrets.PROXMOX_VE_ENDPOINT }}
      PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
      TF_STATE_ACCESS_KEY: ${{ secrets.TF_STATE_ACCESS_KEY }}
      TF_STATE_SECRET_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
