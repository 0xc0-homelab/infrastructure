# Applies environments/prod after a merge to main, once the operator approves
# the production environment.
name: apply

# Only when OpenTofu could change something: a merge that touches no root,
# module or tool version asks for no approval. Run it by hand otherwise.
on:
  push:
    branches: [main]
    paths:
      - 'environments/**'
      - 'modules/**'
      - 'mise.toml'
      - '.github/workflows/plan.yml'
      - '.github/workflows/apply.yml'
  workflow_dispatch:

# id-token: the job logs in to Vault with GitHub's OIDC token.
permissions:
  contents: read
  id-token: write

jobs:
  apply:
    uses: 0xc0-homelab/.github/.github/workflows/tofu-apply.yml@main
    with:
      working-directory: environments/prod
      # The self-hosted runners on the CI VMs, inside the network. Rebuilding a
      # CI VM points this at the other one's label for that PR only.
      runs-on: '{"group": "homelab", "labels": "homelab"}'
      environment: production
      # Every secret from Vault (ci/infrastructure/*, ci/shared/*), with GitHub's
      # OIDC token.
      vault-addr: https://vault.int.0xc0.cc
      vault-role: infrastructure
      vault-secrets: |
        ci/data/infrastructure/proxmox endpoint | PROXMOX_VE_ENDPOINT ;
        ci/data/infrastructure/proxmox api_token | PROXMOX_VE_API_TOKEN ;
        ci/data/shared/rustfs access_key_id | AWS_ACCESS_KEY_ID ;
        ci/data/shared/rustfs secret_access_key | AWS_SECRET_ACCESS_KEY ;
        ci/data/shared/cloudflare api_token | CLOUDFLARE_API_TOKEN ;
        ci/data/infrastructure/warp allowed_emails | TF_VAR_warp_allowed_emails ;
        ci/data/infrastructure/email-routing destinations | TF_VAR_email_destinations ;
        ci/data/infrastructure/email-routing forwards | TF_VAR_email_forwards ;
