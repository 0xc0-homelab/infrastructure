# firewall.tf is generated from docs/zones.md and never edited by hand. This
# fails a PR whose firewall.tf does not match what the matrix generates.
name: firewall-matrix

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: uv

      - name: regenerate
        run: scripts/generate-firewall

      - name: compare
        run: |
          if ! git diff --exit-code -- environments/prod/firewall.tf; then
            echo "::error::environments/prod/firewall.tf does not match docs/zones.md. Run scripts/generate-firewall and commit the result."
            exit 1
          fi
