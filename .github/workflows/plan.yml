# Runs on every PR, with no paths filter on purpose: if this check becomes
# required, a PR the workflow never started for could never merge. PRs that
# touch no OpenTofu finish green without planning.
name: plan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    uses: 0xc0-homelab/.github/.github/workflows/tofu-plan.yml@main
    with:
      working-directory: environments/prod
      paths: '^(environments/|modules/|mise\.toml$|\.github/workflows/(plan|apply)\.yml$)'
    secrets:
      PROXMOX_VE_ENDPOINT: ${{ secrets.PROXMOX_VE_ENDPOINT }}
      PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
      TF_STATE_ACCESS_KEY: ${{ secrets.TF_STATE_ACCESS_KEY }}
      TF_STATE_SECRET_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
