# Declares everything it needs: CI clones this repo on its own.
[tools]
opentofu = "1.12.6"
packer   = "1.16.1"
ansible  = "14.4.0"
jq       = "1.8.2"
# The Vault CLI, the server's version: the scripts read the secrets with it locally.
vault    = "2.0.4"
terraform-docs = "0.24.0"
# mise installs ansible and ansible-lint through uv, which manages its own Python.
uv       = "0.12.17"

"pipx:ansible-lint" = "26.9.0"

[tasks.docs]
description = "Regenerate the inputs/outputs section of every module README"
run = 'for m in modules/*/; do [ -d "$m" ] && terraform-docs markdown table --output-file README.md --output-mode inject "$m"; done'
