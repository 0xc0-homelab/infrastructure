- name: Configure the vm-access connectors
  hosts: access
  become: true
  # One at a time: while one connector restarts, the other keeps admin access.
  serial: 1
  roles:
    - role: base
    - role: cloudflared
      vars:
        # Read from the OpenTofu state by scripts/ansible, into the
        # environment only.
        cloudflared_tunnel_token: "{{ lookup('ansible.builtin.env', 'CLOUDFLARED_TUNNEL_TOKEN') }}"
