# The load balancers first, so the VIP is in front of the bootstrap server
# before the others join through it; the agents last.

- name: Configure the load balancers
  hosts: lb
  become: true
  # One at a time: the VIP stays on the other while one is reconfigured.
  serial: "{{ homelab_serial | default(1) }}"
  roles:
    - role: base
    - role: haproxy
      vars:
        haproxy_listen_address: "{{ platform_vip }}"
        haproxy_internal_address: "{{ platform_internal_vip }}"
        haproxy_backends: >-
          {{ dict(groups['rke2_servers'] | zip(groups['rke2_servers'] | map('extract', hostvars, 'ansible_host')))
             | dict2items(key_name='name', value_name='address') }}
    - role: keepalived
      vars:
        keepalived_vips:
          - "{{ platform_vip }}/{{ platform_prefix_length }}"
          - "{{ platform_internal_vip }}/{{ platform_prefix_length }}"
        keepalived_source_address: "{{ ansible_host }}"
        keepalived_peers: "{{ groups['lb'] | difference([inventory_hostname]) | map('extract', hostvars, 'ansible_host') | list }}"
        # The first load balancer holds the VIPs while its HAProxy is up.
        keepalived_priority: "{{ 150 if inventory_hostname == groups['lb'][0] else 100 }}"
    - role: cloudflared
      vars:
        cloudflared_tunnel_token: "{{ lookup('ansible.builtin.env', 'PUBLIC_TUNNEL_TOKEN') }}"

- name: Configure the RKE2 servers
  hosts: rke2_servers
  become: true
  # One at a time: etcd keeps quorum, and the first server is up before the
  # others join.
  serial: "{{ homelab_serial | default(1) }}"
  roles:
    - role: base
    - role: longhorn_node
    - role: rke2_server
      vars:
        rke2_server_token: "{{ lookup('ansible.builtin.env', 'RKE2_TOKEN') }}"
        rke2_server_registration_address: "{{ platform_vip }}"
        rke2_server_node_ip: "{{ ansible_host }}"
        rke2_server_peers: "{{ groups['rke2_servers'] | difference([inventory_hostname]) | map('extract', hostvars, 'ansible_host') | list }}"
        rke2_server_bootstrap: "{{ inventory_hostname == groups['rke2_servers'][0] }}"
        rke2_server_tls_san:
          - "{{ platform_vip }}"
    - role: argocd
      vars:
        argocd_admin_password_bcrypt: "{{ lookup('ansible.builtin.env', 'ARGOCD_ADMIN_PASSWORD_BCRYPT') }}"

- name: Configure the RKE2 agents
  hosts: rke2_agents
  become: true
  # One at a time, like the servers: a bad change stops at the first.
  serial: "{{ homelab_serial | default(1) }}"
  roles:
    - role: base
    - role: longhorn_node
    - role: rke2_agent
      vars:
        rke2_agent_token: "{{ lookup('ansible.builtin.env', 'RKE2_TOKEN') }}"
        rke2_agent_registration_address: "{{ platform_vip }}"
        rke2_agent_node_ip: "{{ ansible_host }}"
