# The RKE2 cluster and its load balancer. The load balancers go first, so the
# VIP is in front of the bootstrap server before the others join through it.

- name: Configure the load balancers
  hosts: lb
  become: true
  # One at a time: the VIP stays on the other while one is reconfigured.
  serial: 1
  roles:
    - role: base
    - role: haproxy
      vars:
        haproxy_listen_address: "{{ platform_vip }}"
        haproxy_backends: >-
          {{ dict(groups['rke2_servers'] | zip(groups['rke2_servers'] | map('extract', hostvars, 'ansible_host')))
             | dict2items(key_name='name', value_name='address') }}
    - role: keepalived
      vars:
        keepalived_vip: "{{ platform_vip }}/{{ platform_prefix_length }}"
        keepalived_source_address: "{{ ansible_host }}"
        keepalived_peers: "{{ groups['lb'] | difference([inventory_hostname]) | map('extract', hostvars, 'ansible_host') | list }}"
        # The first load balancer holds the VIP while its HAProxy is up.
        keepalived_priority: "{{ 150 if inventory_hostname == groups['lb'][0] else 100 }}"

- name: Configure the RKE2 servers
  hosts: rke2_servers
  become: true
  # One at a time: etcd keeps quorum, and the first server is up before the
  # others join.
  serial: 1
  roles:
    - role: base
    - role: rke2_server
      vars:
        # Decrypted from secrets/ansible.sops.yaml by the wrapper script, into
        # the environment only.
        rke2_server_token: "{{ lookup('ansible.builtin.env', 'RKE2_TOKEN') }}"
        rke2_server_registration_address: "{{ platform_vip }}"
        rke2_server_node_ip: "{{ ansible_host }}"
        rke2_server_peers: "{{ groups['rke2_servers'] | difference([inventory_hostname]) | map('extract', hostvars, 'ansible_host') | list }}"
        rke2_server_bootstrap: "{{ inventory_hostname == groups['rke2_servers'][0] }}"
        rke2_server_tls_san:
          - "{{ platform_vip }}"

# The admin kubeconfig, pointed at the VIP, into secrets/kubeconfig.sops.yaml.
# It never touches the disk in the clear, and is rewritten only when it
# changes, so a run with nothing new leaves no diff to commit.
- name: Save the admin kubeconfig, encrypted
  hosts: rke2_servers[0]
  become: true
  gather_facts: false
  tasks:
    - name: Read the admin kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/rke2/rke2.yaml
      register: cluster_kubeconfig
      no_log: true
      # On a dry run before the first real one, the file does not exist yet.
      when: not ansible_check_mode

    - name: Encrypt it into secrets/kubeconfig.sops.yaml
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          new="$(cat)"
          file="{{ playbook_dir }}/../../secrets/kubeconfig.sops.yaml"
          if [ -f "$file" ] && [ "$(sops decrypt "$file")" = "$new" ]; then
            echo unchanged
            exit 0
          fi
          printf '%s\n' "$new" \
            | sops encrypt --filename-override "$file" --input-type yaml --output-type yaml /dev/stdin > "$file.tmp"
          mv "$file.tmp" "$file"
          echo written
        executable: /bin/bash
        stdin: "{{ cluster_kubeconfig.content | b64decode | replace('https://127.0.0.1:6443', 'https://' ~ platform_vip ~ ':6443') }}"
      register: cluster_kubeconfig_file
      changed_when: "'written' in cluster_kubeconfig_file.stdout"
      delegate_to: localhost
      become: false
      no_log: true
      when: not ansible_check_mode
