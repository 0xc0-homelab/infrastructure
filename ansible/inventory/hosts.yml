# The node, and the VMs by zone. Mirrors the vms map in
# environments/prod/terraform.tfvars.
all:
  children:
    node:
      hosts:
        pve-1:
          # The operator's SSH alias for the node.
          ansible_host: hetzner
    vms:
      children:
        mgmt:
          children:
            # The connectors of the vm-access tunnel.
            access:
              hosts:
                vm-access-01:
                  ansible_host: 10.10.0.10
                vm-access-02:
                  ansible_host: 10.10.0.20
        ci:
          hosts:
            # The self-hosted GitHub Actions runners.
            vm-ci:
              ansible_host: 10.10.1.10
        # The RKE2 cluster and its load balancer: the cluster map in
        # terraform.tfvars.
        platform:
          children:
            # HAProxy + keepalived, sharing the VIP 10.10.4.10.
            lb:
              hosts:
                vm-lb-01:
                  ansible_host: 10.10.4.11
                vm-lb-02:
                  ansible_host: 10.10.4.12
            # Identical RKE2 servers: control plane, etcd and workloads.
            rke2_servers:
              hosts:
                vm-rke2-01:
                  ansible_host: 10.10.4.21
                vm-rke2-02:
                  ansible_host: 10.10.4.22
                vm-rke2-03:
                  ansible_host: 10.10.4.23
