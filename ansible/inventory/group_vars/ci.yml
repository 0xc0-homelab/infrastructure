# The runners' own GitHub App. Not secret; its key comes from Vault
# (ci/infrastructure/runner-app).
github_runner_app_id: "5051391"
github_runner_app_installation_id: "164149198"

# The VM's own name lets a job pin itself to one VM: rebuilding a CI VM runs
# its apply on the other one.
github_runner_labels:
  - homelab
  - "{{ inventory_hostname }}"

# The CI VMs are not on WARP, so Gateway does not resolve the internal names
# for them.
github_runner_hosts:
  - address: "{{ platform_internal_vip }}"
    names: [vault.int.0xc0.cc]
