# Every VM, reached directly: over WARP from the laptop, from the CI VMs in
# the pipeline, which points HOMELAB_SSH_KEY_FILE at CI's key.
ansible_user: ops
ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'HOMELAB_SSH_KEY_FILE', default='~/.ssh/0xc0-homelab') }}"

# The keys ops accepts: vm_admin_ssh_keys in environments/prod/terraform.tfvars,
# the one list, which the wrapper script reads from the OpenTofu state.
base_admin_user: ops
base_hostname: "{{ inventory_hostname }}"
base_admin_ssh_keys: "{{ lookup('ansible.builtin.env', 'HOMELAB_ADMIN_SSH_KEYS') | from_json }}"

# Keepalives: a session cut underneath (a connector restarting) fails in 45s
# instead of hanging.
ansible_ssh_common_args: >-
  -o StrictHostKeyChecking=accept-new
  -o UserKnownHostsFile={{ lookup('ansible.builtin.env', 'HOMELAB_KNOWN_HOSTS', default='~/.ssh/known_hosts') }}
  -o ServerAliveInterval=15 -o ServerAliveCountMax=3
