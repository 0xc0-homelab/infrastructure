# Every VM, reached directly over WARP.
ansible_user: ops
ansible_ssh_private_key_file: ~/.ssh/0xc0-homelab

# Keepalives: a session cut underneath (a connector restarting) fails in 45s
# instead of hanging.
ansible_ssh_common_args: >-
  -o StrictHostKeyChecking=accept-new
  -o ServerAliveInterval=15 -o ServerAliveCountMax=3
