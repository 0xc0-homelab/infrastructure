- name: Install the rules script
  ansible.builtin.template:
    src: homelab-forwarding.j2
    dest: /usr/local/sbin/homelab-forwarding
    owner: root
    group: root
    mode: "0755"
  notify: Reapply homelab forwarding

- name: Install the systemd unit
  ansible.builtin.template:
    src: homelab-forwarding.service.j2
    dest: /etc/systemd/system/homelab-forwarding.service
    owner: root
    group: root
    mode: "0644"
  register: node_forwarding_unit
  notify: Reapply homelab forwarding

# On a first dry run the unit does not exist yet: skip rather than fail.
- name: Enable and start homelab forwarding
  ansible.builtin.systemd_service:
    name: homelab-forwarding
    enabled: true
    state: started
    daemon_reload: true
  when: not (ansible_check_mode and node_forwarding_unit.changed)
