- name: Install the rules script
  ansible.builtin.template:
    src: homelab-forwarding.j2
    dest: /usr/local/sbin/homelab-forwarding
    owner: root
    group: root
    mode: "0755"
  notify: Reapply homelab forwarding

- name: Install the systemd unit
  ansible.builtin.template:
    src: homelab-forwarding.service.j2
    dest: /etc/systemd/system/homelab-forwarding.service
    owner: root
    group: root
    mode: "0644"
  register: node_forwarding_unit
  notify: Reapply homelab forwarding

# On a first dry run the unit does not exist yet: skip rather than fail.
- name: Enable and start homelab forwarding
  ansible.builtin.systemd_service:
    name: homelab-forwarding
    enabled: true
    state: started
    daemon_reload: true
  when: not (ansible_check_mode and node_forwarding_unit.changed)

- name: Flush handlers, so the rules are applied before they are checked
  ansible.builtin.meta: flush_handlers

- name: Read the homelab rules in DOCKER-USER
  ansible.builtin.command: iptables -S DOCKER-USER
  register: node_forwarding_rules
  changed_when: false
  check_mode: false
  failed_when: false

# Two rules plus one per no-egress zone — exactly once each. More means the
# script stopped removing its old rules.
- name: Check the rules are applied exactly once
  ansible.builtin.assert:
    that: >-
      (node_forwarding_rules.stdout_lines | select('search', 'homelab-forwarding') | list | length)
      == 2 + (node_forwarding_no_egress_cidrs | length)
    fail_msg: >-
      Expected {{ 2 + (node_forwarding_no_egress_cidrs | length) }} homelab-forwarding rules in DOCKER-USER,
      found {{ node_forwarding_rules.stdout_lines | select('search', 'homelab-forwarding') | list | length }}.
  when: not ansible_check_mode
