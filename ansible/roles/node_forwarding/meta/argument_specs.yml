argument_specs:
  main:
    short_description: Keep data off the internet at the node, in DOCKER-USER
    description:
      - Docker on the node sets the iptables FORWARD policy to ACCEPT
        (`ip-forward-no-drop`), so this role adds a DROP rule to DOCKER-USER,
        the chain Docker reserves for user rules and never flushes, for every
        zone that must never reach the internet. It re-applies the rule every
        time Docker starts. Inter-zone traffic is not filtered here; that is
        the zone firewall's job.
    options:
      node_forwarding_no_egress_cidrs:
        type: list
        elements: str
        default: [10.10.32.0/24]
        description: Zones that must never reach the internet.
      node_forwarding_uplink:
        type: str
        default: eno1
        description: The node's public interface.
