# The API and the supervisor, where servers register, go to the same port; the
# web ingress goes to Traefik's fixed NodePorts (gitops, platform/traefik):
# 443 to websecure, where TLS ends with Let's Encrypt, and 80 to web, which only
# redirects to it. The internal VIP's 443 goes to Traefik's internal
# entrypoint, the WARP-only path, which the public tunnel never reaches.
haproxy_frontends:
  - { name: kube-apiserver, port: 6443, backend_port: 6443 }
  - { name: rke2-supervisor, port: 9345, backend_port: 9345 }
  - { name: ingress-http, port: 80, backend_port: 30080 }
  - { name: ingress-https, port: 443, backend_port: 30443 }
  - { name: internal-https, port: 443, backend_port: 30444, internal: true }

# The internal VIP. Unset, no internal frontend is written.
haproxy_internal_address: ""

# Kubernetes watches stay open with little traffic: a short idle timeout cuts
# them.
haproxy_timeout: 30m
