argument_specs:
  main:
    short_description: HAProxy in TCP mode in front of the RKE2 servers
    description:
      - Installs HAProxy and forwards each frontend, bound to the VIP (or the
        internal VIP), to the same backend port on every RKE2 server. TCP only; TLS ends in the
        cluster. The backup load balancer binds the VIP too, before it holds
        it, through net.ipv4.ip_nonlocal_bind.
    options:
      haproxy_listen_address:
        type: str
        required: true
        description: The VIP keepalived holds. Never 0.0.0.0.
      haproxy_internal_address:
        type: str
        default: ""
        description: The internal VIP, for the frontends marked internal. Empty, those are left out.
      haproxy_backends:
        type: list
        elements: dict
        required: true
        description: The RKE2 servers, each a name and an address.
        options:
          name:
            type: str
            required: true
          address:
            type: str
            required: true
      haproxy_frontends:
        type: list
        elements: dict
        description: What is forwarded, each a name, the port on the VIP, the port on the servers, and whether it binds the internal VIP.
        options:
          name:
            type: str
            required: true
          port:
            type: int
            required: true
          backend_port:
            type: int
            required: true
          internal:
            type: bool
            default: false
      haproxy_timeout:
        type: str
        default: 30m
        description: Client and server idle timeout. Long, for Kubernetes watches.
