- name: Refuse an empty secret value
  ansible.builtin.assert:
    that: cluster_secrets_items | map(attribute='data') | map('dict2items') | flatten | selectattr('value', 'equalto', '') | list | length == 0
    fail_msg: A cluster secret is empty. Run through the wrapper script, which reads them from SOPS.
  no_log: true

# Root only: the file holds the values in the clear, as the RKE2 token does.
- name: Write the cluster's boot secrets
  ansible.builtin.template:
    src: cluster-secrets.yaml.j2
    dest: "{{ cluster_secrets_manifest }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
