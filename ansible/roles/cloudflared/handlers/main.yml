# Handlers run in check mode too: on a first dry run the unit does not exist.
#
# Ansible reaches this VM through the tunnel it is restarting. A plain restart
# deadlocks: cloudflared waits for its connections to drain, Ansible's own SSH
# among them, and Ansible waits for the restart. So the restart runs detached,
# after a pause that lets this task return, and Ansible then reconnects, through
# whichever connector WARP picks.
- name: Restart cloudflared
  ansible.builtin.command:
    cmd: systemd-run --collect --unit=cloudflared-restart --on-active=3s /usr/bin/systemctl restart cloudflared
  changed_when: true
  when: not (ansible_check_mode and (cloudflared_unit.changed or cloudflared_deb.changed))
  notify: Wait for the connection after the restart

- name: Wait for the connection after the restart
  ansible.builtin.wait_for_connection:
    delay: 15
    timeout: 120
  when: not ansible_check_mode
