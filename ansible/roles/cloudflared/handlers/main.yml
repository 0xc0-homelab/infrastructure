# Ansible reaches this VM through the tunnel it restarts: a plain restart
# deadlocks waiting for Ansible's own SSH to drain, so it runs detached.
- name: Restart cloudflared
  ansible.builtin.command:
    cmd: systemd-run --collect --unit=cloudflared-restart --on-active=3s /usr/bin/systemctl restart cloudflared
  changed_when: true
  when: not (ansible_check_mode and (cloudflared_unit.changed or cloudflared_deb.changed))
  notify: Wait for the connection after the restart

- name: Wait for the connection after the restart
  ansible.builtin.wait_for_connection:
    delay: 15
    timeout: 120
  when: not ansible_check_mode
