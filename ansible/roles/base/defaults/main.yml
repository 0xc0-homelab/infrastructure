# Packages every VM needs.
base_packages:
  - qemu-guest-agent

# The admin user cloud-init created, and the public keys it must accept, CI's
# among them. cloud-init sets them on a VM's first boot only; this keeps them
# on every VM after that. Empty on a Packer build: the user does not exist in
# a template.
base_admin_user: ""
base_admin_ssh_keys: []
