- name: Install baseline packages (Debian)
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == "Debian"

# Rocky's mirror list sends Hetzner's network to a mirror serving ~40 KB/s;
# the repo files already carry the CDN's baseurl, commented out.
- name: Find the Rocky repo files
  ansible.builtin.find:
    paths: /etc/yum.repos.d
    patterns: "rocky*.repo"
  register: base_rocky_repos
  when: ansible_facts.os_family == "RedHat"

- name: Drop the mirror list
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '^mirrorlist='
    replace: '#mirrorlist='
  loop: "{{ base_rocky_repos.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: ansible_facts.os_family == "RedHat"

- name: Use Rocky's CDN, over HTTPS
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '^#baseurl=http://dl\.rockylinux\.org/'
    replace: 'baseurl=https://dl.rockylinux.org/'
  loop: "{{ base_rocky_repos.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: ansible_facts.os_family == "RedHat"

- name: Install baseline packages (Rocky)
  ansible.builtin.dnf:
    name: "{{ base_packages }}"
    state: present
  when: ansible_facts.os_family == "RedHat"

# No start task for qemu-guest-agent: systemd starts it when the virtio port
# appears.

# On Rocky, SELinux keeps qemu-guest-agent from freezing the kubelet and CSI
# mounts: without this, backups are crash-consistent only.
- name: Read qemu-guest-agent's SELinux boolean (Rocky)
  ansible.builtin.command:
    cmd: getsebool virt_qemu_ga_read_nonsecurity_files
  register: base_qemu_ga_boolean
  changed_when: false
  check_mode: false
  when: ansible_facts.os_family == "RedHat"

- name: Let qemu-guest-agent freeze every filesystem (Rocky)
  ansible.builtin.command:
    cmd: setsebool -P virt_qemu_ga_read_nonsecurity_files on
  changed_when: true
  when:
    - ansible_facts.os_family == "RedHat"
    - base_qemu_ga_boolean.stdout is not search('--> on$')

- name: Harden SSH
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart ssh

- name: Find the admin user's home
  ansible.builtin.getent:
    database: passwd
    key: "{{ base_admin_user }}"
  when: base_admin_user | length > 0

# Added, never removed: revoking a key is a rebuild, or by hand, deliberately.
- name: Authorise the admin keys
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts.getent_passwd[base_admin_user][4] }}/.ssh/authorized_keys"
    line: "{{ item }}"
    create: false
  loop: "{{ base_admin_ssh_keys }}"
  loop_control:
    # The key's comment, not the key.
    label: "{{ item.split(' ')[2:] | join(' ') }}"
  when: base_admin_user | length > 0

- name: Set the hostname
  ansible.builtin.hostname:
    name: "{{ base_hostname }}"
  when: base_hostname | length > 0
