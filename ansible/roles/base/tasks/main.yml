- name: Install baseline packages (Debian)
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == "Debian"

- name: Install baseline packages (Rocky)
  ansible.builtin.dnf:
    name: "{{ base_packages }}"
    state: present
  when: ansible_facts.os_family == "RedHat"

# No start task for qemu-guest-agent: systemd starts it when the virtio port
# appears.

- name: Harden SSH
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart ssh
