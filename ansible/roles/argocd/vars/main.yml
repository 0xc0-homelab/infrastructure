# Every RKE2 server applies what it finds here, and again whenever it changes.
argocd_manifests_dir: /var/lib/rancher/rke2/server/manifests
argocd_chart_repo: https://argoproj.github.io/argo-helm

argocd_values:
  global:
    image: "{{ argocd_image }}"
  redis:
    image: "{{ argocd_redis_image }}"
  dex:
    enabled: false
  configs:
    secret:
      argocdServerAdminPassword: "{{ argocd_admin_password_bcrypt }}"
    # gitops inflates its charts through Kustomize's helmCharts.
    cm:
      kustomize.buildOptions: --enable-helm
    # Plain HTTP: Traefik ends TLS.
    params:
      server.insecure: true
      otlp.address: openobserve-collector-gateway-collector.openobserve-collector.svc.cluster.local:4317
      otlp.insecure: true
  # The OpenObserve collector's target allocator finds the ServiceMonitors.
  controller:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  server:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  repoServer:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  applicationSet:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
