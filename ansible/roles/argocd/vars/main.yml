# Every RKE2 server applies what it finds here, and again whenever it changes.
argocd_manifests_dir: /var/lib/rancher/rke2/server/manifests
argocd_chart_repo: https://argoproj.github.io/argo-helm

# The chart's values. Dex stays off: single sign-on comes with Vault and OIDC
# in phase 3.
argocd_values:
  global:
    image: "{{ argocd_image }}"
  redis:
    image: "{{ argocd_redis_image }}"
  dex:
    enabled: false
  configs:
    secret:
      argocdServerAdminPassword: "{{ argocd_admin_password_bcrypt }}"
    # gitops lays each component out as a Kustomize directory whose
    # helmCharts inflate its pinned charts: Kustomize needs Helm for that.
    cm:
      kustomize.buildOptions: --enable-helm
    # Plain HTTP behind Traefik, which ends TLS with the *.int.0xc0.cc
    # wildcard (https://argocd.int.0xc0.cc, over WARP only).
    params:
      server.insecure: true
      # Traces of every sync and request, over OTLP, to the OpenObserve
      # collector's gateway (gitops, openobserve-collector). Plain gRPC, in
      # the cluster.
      otlp.address: openobserve-collector-gateway-collector.openobserve-collector.svc.cluster.local:4317
      otlp.insecure: true
  # Metrics, each with a ServiceMonitor the collector's target allocator
  # finds. argocd has no NetworkPolicies: nothing to open.
  controller:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  server:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  repoServer:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  applicationSet:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
