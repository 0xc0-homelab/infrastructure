# By the serial Proxmox gives each slot: the sdX names change between boots.
longhorn_node_disks:
  - /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
  - /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi2

longhorn_node_path: /var/lib/longhorn

# Excluded from updates: open-iscsi 2.1.12 (6.2.1.12 in Rocky's numbering)
# breaks Longhorn. Check Longhorn's requirements before a bump.
longhorn_node_iscsi_version: "6.2.1.11-1.git4b3e853.el10_2.2"
