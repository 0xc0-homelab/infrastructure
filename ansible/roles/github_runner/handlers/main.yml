# Handlers run in check mode too: on a first dry run the units do not exist.
#
# Only the idle runners restart. The busy one may be running the very job that
# applies this, from the pipeline: killing it would fail that job halfway. It
# starts on the new config when its job ends.
- name: Restart idle runners
  ansible.builtin.command:
    cmd: /usr/local/libexec/github-runner-restart-idle
  register: github_runner_restart
  changed_when: "'restarted' in github_runner_restart.stdout"
  when: not (ansible_check_mode and github_runner_unit.changed)
